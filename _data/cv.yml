    Publications:
      - title: "Improving LLM Language Understanding through the Application of Critical Thinking"
        authors:
          - JeongBeom Baek
        date: 2024
        publisher: "22nd KSEF Science Project Competition (한국과학기술경진대회)"
        url: https://ericbaek0828-netizen.github.io/assets/pdf/KSEF_2024_Paper.pdf
        summary: >
          Proposed applying human critical thinking patterns to LLM inference — generating and
          verifying logical hypotheses before producing responses, rather than direct token prediction.
          Fine-tuned Llama 3.2 3B with LoRA on a custom Korean dataset (merged-v2). The critical
          thinking model scored 0.566 vs baseline 0.466 on language understanding, reasoning,
          and requirement fulfillment metrics.
        highlights:
          - "Independently identified LLM reasoning fragility as a core problem — 2 years before it became mainstream"
          - "Built custom Korean dataset (merged-v2) with 50% text analysis, 25% logical reasoning, 25% problem-solving"
          - "Implemented hypothesis-generation pipeline: context → generate all logical hypotheses → verify → select most valid → respond"
          - "Fine-tuned using Unsloth + LoRA (rank 16, alpha 16) with 4-bit quantization on Google Colab"
          - "[Download Presentation](/assets/pdf/KSEF_2024_Presentation.pptx)"

